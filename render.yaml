services:
  - type: web
    name: ai-offer-letter-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONPATH
        value: /app
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: offer-letter-index
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-west-2
    healthCheckPath: /api/health/
    autoDeploy: true
